[project]
name = "board-review-eval"
version = "0.1.0"
description = "Evaluation harness for the board-review plugin"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.10.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["eval/scoring/tests"]
pythonpath = ["."]
